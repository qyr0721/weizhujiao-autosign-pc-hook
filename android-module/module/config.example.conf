# 复制为 config.conf 后填入你自己的值（config.conf 不会进仓库）
# 部署位置：/data/adb/modules/tm-autosign/config.conf

# 教室坐标（只在 isGPS>0 的签到里使用）。请填你本人所在位置，
# 填别处的坐标属于伪造位置，性质和代签一样。
LAT="30.0000000"
LON="104.0000000"

# 每次提交前在基准点上做 ±JITTER_DEG 度的随机偏移，避免坐标一字不差
JITTER_DEG="0.00003"

# 轮询间隔（秒）
INTERVAL=5

# 主动续号周期（秒）。openid 实测 15 分钟失效，留 4 分钟余量
REFRESH_EVERY=660

# 在这个时段（小时）内持有 wakelock，防止熄屏后 CPU 挂起把轮询拖慢；
# 其余时段释放以省电。全天保活就写 0 和 24。
WK_START=7
WK_END=23
