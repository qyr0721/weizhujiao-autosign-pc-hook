name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.6.0'
        required: true
        default: 'v1.6.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # runner 默认非 UTF-8，中文测试输出会让整套离线测试瞬间崩掉
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.22.3" "websockets==13.1"

      - name: Offline test suite
        run: python test/run_all.py

      - name: Build portable exe
        run: python build.py portable

      - name: Verify bundled source is current
        run: python tools/verify_bundle.py dist/wxsign-portable.exe

      # Runner 上没有微信，--check 必然返回 1；只要求 exe 能启动、不崩。
      # 入口已换成 app.py（图形界面），--check 是其自检参数，不打开窗口。
      - name: Smoke test
        continue-on-error: true
        shell: bash
        run: ./dist/wxsign-portable.exe --check

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "Publishing release for ${TAG}"
          gh release create "${TAG}" \
            --title "wxsign ${TAG}" \
            --generate-notes \
            dist/wxsign-portable.exe
